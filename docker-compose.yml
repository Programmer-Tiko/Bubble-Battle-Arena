# Local setup: `docker compose up`, then open http://localhost:8080/
# Only nginx publishes a port. The app, auth server, and database are reachable only
# inside Docker's private network.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - auth

  # Express game server: serves the frontend at / and /api/me (production entry point)
  app:
    build: .
    restart: unless-stopped
    command: ["node", "services/game/dist/production.js"]
    environment:
      PORT: "3000"
      PUBLIC_KEY_PATH: /keys/public/public.pem
    volumes:
      - jwt_public_key:/keys/public:ro # public key only, read-only
    depends_on:
      - auth

  # Separate auth server: /register, /login, /logout, issues RS256 JWTs
  auth:
    build: .
    restart: unless-stopped
    command: ["node", "services/auth/dist/index.js"]
    environment:
      PORT: "3002"
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-bubble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bubble_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-bubble}
      PRIVATE_KEY_PATH: /keys/private/private.pem
      PUBLIC_KEY_PATH: /keys/public/public.pem
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false} # local HTTP only; the deployed setup must use true
      TRUST_PROXY: "true" # requests come through nginx
    volumes:
      - auth_private_key:/keys/private # private key: ONLY the auth container mounts this
      - jwt_public_key:/keys/public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bubble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bubble_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-bubble}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    # No "ports:" on purpose: the database must never be reachable from outside

volumes:
  postgres_data:
  auth_private_key:
  jwt_public_key: