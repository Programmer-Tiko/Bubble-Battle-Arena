events {}

http {
  # Docker's internal DNS server. Looking names up per request (with a short cache) means
  # nginx finds app/auth even if they restart with a new address, and nginx doesn't crash
  # at startup if they aren't running yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rate limit for the auth routes, per client IP (the auth server also limits per account)
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;

  # WebSocket upgrade support: "Connection: upgrade" only when the client asked to upgrade
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;

    # Variables make nginx resolve the names with the resolver above on each request
    set $app_server  http://app:3000;
    set $auth_server http://auth:3002;

    # Authentication requests go ONLY to the auth server; the app never sees them
    location ~ ^/(register|login|logout)$ {
      limit_req zone=auth_limit burst=20 nodelay;
      limit_req_status 429;
      proxy_pass $auth_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO / WebSocket traffic for the game
    location /socket.io/ {
      proxy_pass $app_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Everything else (home page, /api/me, frontend files) goes to the app
    location / {
      proxy_pass $app_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}