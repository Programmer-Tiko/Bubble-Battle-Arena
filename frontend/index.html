<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubble Battle Arena</title>
  </head>
  <body>
    <main>
      <h1>Bubble Battle Arena</h1>
      <p>Local prototype - Move with WASD or arrow keys - Space places a bomb - 1?5 place inventory traps</p>
      <p>Items: green boots, purple bomb capacity, orange blast range, yellow banana, pink slowdown. Outlined items are traps or hazards.</p>
      <section aria-label="Local multiplayer development controls">
        <label>Mode <select id="mode"><option value="ffa">FFA</option><option value="team">Team Battle</option></select></label>
        <label>Players <select id="players"><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
        <button id="create-session">Create test session</button>
        <label>Session ID <input id="session" size="38" /></label>
        <label>Join as <select id="role"><option value="player">Player</option><option value="spectator">Spectator</option></select></label>
        <button id="join-session">Join</button><button id="local-mode">Local mode</button>
        <p id="notice" role="status"></p>
        <p id="status">Local mode</p>
      </section>
      <div id="game" aria-label="Game arena"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
